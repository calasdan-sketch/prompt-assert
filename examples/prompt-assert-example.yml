# Copy this file into your repo's .github/workflows/ to run prompt-assert
# on every push and pull request.
#
# It uses --demo, so CI never needs a live model or API key. Demo mode
# answers with a built-in fake model that only knows the example
# `sentiment` prompt scaffolded by `prompt-assert init` (it is scaffolded
# into a temp dir if your repo has none), so this checks the install and
# wiring - not your own prompts' quality.
#
# To gate on your real prompts, add repo secrets for a model the runner
# can reach and use the commented step instead.
name: prompt-assert (example)

on:
  push:
  pull_request:

jobs:
  prompts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # prompt-assert has no dependencies. Pin a version you have looked at,
      # so a later release cannot change your CI without a commit from you.
      - name: Install prompt-assert
        run: pip install "prompt-assert==0.4.0"
      - name: Prompt regression tests (demo mode, fake model)
        run: prompt-assert --demo run --prompt sentiment --version v1
      # Free, deterministic CI on your own prompts: record once on your
      # machine (prompt-assert run --all --record), commit
      # prompts/*.cassette.json, then replay it here. No model, no secrets,
      # no cost; a prompt or input changed since recording is exit 2.
      # - name: Prompt regression tests (replay)
      #   run: prompt-assert run --all --replay --junit prompt-assert.xml --markdown "$GITHUB_STEP_SUMMARY"
      # Real model instead of the demo: every prompt x every version in one
      # go (exit 1 = a case failed, exit 2 = model unreachable / bad cases
      # file; the first unanswered case stops the run, --timeout caps each
      # request):
      # - name: Prompt regression tests
      #   env:
      #     PROMPT_ASSERT_BASE_URL: ${{ secrets.PROMPT_ASSERT_BASE_URL }}
      #     PROMPT_ASSERT_API_KEY: ${{ secrets.PROMPT_ASSERT_API_KEY }}
      #     PROMPT_ASSERT_MODEL: llama3.1
      #   run: prompt-assert run --all --no-cache --timeout 60
