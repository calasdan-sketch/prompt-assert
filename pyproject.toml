[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-assert"
version = "0.3.0"
description = "Pytest for prompts: catch LLM regressions in CI before your users do. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "prompts", "regression-testing", "prompt-engineering", "ci", "ollama", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/prompt-assert"
Repository = "https://github.com/calasdan-sketch/prompt-assert"
Issues = "https://github.com/calasdan-sketch/prompt-assert/issues"

[project.scripts]
prompt-assert = "prompt_assert.cli:main"
promptregress = "prompt_assert.cli:main"  # old name, kept as an alias

[tool.setuptools]
packages = ["prompt_assert"]
